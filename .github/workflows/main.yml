
name: JRA Dead Heat Notifier

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test automatic execution
        run: |
          python -c "from datetime import datetime, timezone; print('JRA notification system started:', datetime.now(timezone.utc))"

      - name: Run Python program
        run: python main.py

      - name: Check event type
        run: |
          echo "Event name: ${{ github.event_name }}"

      - name: Send test notification to iPhone
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl --fail --silent --show-error \
            -H "Title: JRA notification test" \
            -d "GitHubからiPhoneへの通知テストです。" \
            "https://ntfy.sh/${NTFY_TOPIC}"

