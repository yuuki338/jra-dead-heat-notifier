
name: JRA Dead Heat Notifier

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test automatic execution
        run: |
          python -c "from datetime import datetime, timezone; print('JRA notification system started:', datetime.now(timezone.utc))"
